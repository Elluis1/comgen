[pytest]
pythonpath = .

# Aviso inocuo de Starlette: TestClient prefiere httpx2, pero FastAPI
# reexporta starlette.testclient y la app sigue con httpx. El cliente de
# test funciona igual; no se cambia la dependencia para tapar el aviso.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
